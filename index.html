<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovation Website</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>
        <h1>
            <i class="fa-solid fa-lightbulb"></i>
            Innovation Competition
        </h1>
        <p>Where Ideas Become Reality</p>
    </header>

    <!-- NAV -->
    <nav class="main-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="kategori.html"><i class="fa-solid fa-list"></i> Categories</a>
        <a href="daftar.html"><i class="fa-solid fa-pen-to-square"></i> Register</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main>

        <!-- COUNTDOWN -->
        <h2>
            <i class="fa-solid fa-rocket"></i>
            Countdown to Event
        </h2>

        <div class="flip-clock">
            <div class="time-box">
                <span id="days">00</span>
                <p>Days</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Minutes</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Seconds</p>
            </div>
        </div>

        <!-- MAP SECTION -->
        <h2>
            <i class="fa-solid fa-location-dot"></i>
            Event Location
        </h2>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5630.555005600012!2d101.53564089062603!3d3.721830522814039!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x31cb89c69b82a3ab%3A0x7fa38dc86ca7823!2sKompleks%20Akademik%20UPSI!5e0!3m2!1sen!2smy!4v1777868084602!5m2!1sen!2smy" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        

    </main>

    <!-- SIDEBAR -->
    <aside>
        <div class="participant-box">
        <h2>Participants</h2>
        <h1 id="count">0</h1>
    </div>
    </aside>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Innovation Event</p>
    </footer>

</div>

<!-- TIMER SCRIPT -->
<script>
const targetDate = new Date(2026, 7, 12, 9, 0, 0).getTime();

function updateFlip(id, value) {
    const el = document.getElementById(id);

    if (el.innerText != value) {
        el.classList.add("flip");

        setTimeout(() => {
            el.innerText = value;
            el.classList.remove("flip");
        }, 150);
    }
}

setInterval(() => {
    const now = new Date().getTime();
    const diff = targetDate - now;

    if (diff <= 0) return;

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    updateFlip("days", d);
    updateFlip("hours", h);
    updateFlip("minutes", m);
    updateFlip("seconds", s);

}, 1000);

async function updateCount() {
    const response = await fetch("https://script.google.com/macros/s/AKfycby4aYDxU8yv1ElqwkVaMEBnxDwyqdv9KsiQAQOSUeU4nR261nS4y855_ebGj-OmS-UtNg/exec");
    
    const text = await response.text();
    console.log("API response:", text);

    document.getElementById("count").innerText = text;
}

updateCount();
</script>

</body>
</html>
